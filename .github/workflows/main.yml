name: Manual Pure Deploy to Firebase

on:
  push:
    branches:
      - main
jobs:
  test:
    name: Run test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
  
      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install Dependencies
        run npm ci
      - name: Run Tests
        run npm test

  deploy_site:
    runs-on: ubuntu-latest
    needs: test
    steps:
      # Step 1: Clone repository onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4
  
      # Step 2: Set up Node.js runtime environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
  
      # Step 3: Install Firebase CLI directly on the runner
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
  
      # Step 4: Execute deployment command using the secret token
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN}}
        run: firebase deploy --only hosting --token "$FIREBASE_TOKEN"
